name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify pyproject.toml version matches tag
        shell: bash
        run: |
          PYPROJECT_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$PYPROJECT_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::pyproject.toml version ($PYPROJECT_VERSION) does not match tag (${{ steps.version.outputs.version }}). Bump the version in pyproject.toml to match before tagging."
            exit 1
          fi

      - name: Stamp exe version metadata from tag
        shell: python
        run: |
          import re, pathlib
          v = "${{ steps.version.outputs.version }}"
          parts = (v.split(".") + ["0", "0", "0", "0"])[:4]
          tup = f"({', '.join(parts)})"
          p = pathlib.Path("packaging/version_info.txt")
          text = p.read_text()
          text = re.sub(r"filevers=\([^)]*\)", f"filevers={tup}", text)
          text = re.sub(r"prodvers=\([^)]*\)", f"prodvers={tup}", text)
          text = re.sub(r"u'FileVersion', u'[^']*'", f"u'FileVersion', u'{v}'", text)
          text = re.sub(r"u'ProductVersion', u'[^']*'", f"u'ProductVersion', u'{v}'", text)
          p.write_text(text)

      - name: Build with PyInstaller
        run: uv run pyinstaller packaging/snipperai.spec --distpath dist --workpath build --noconfirm

      - name: Zip build output
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/SnipperAI/*" -DestinationPath "dist/SnipperAI-${{ steps.version.outputs.version }}-windows.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SnipperAI-${{ steps.version.outputs.version }}-windows.zip
          generate_release_notes: true